<svg viewBox="0 0 340 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6"/>
      <stop offset="100%" stop-color="#00327f"/>
    </linearGradient>
  </defs>

  <!-- Compact emblem -->
  <g transform="translate(32,32)">
    <circle cx="0" cy="0" r="27" fill="none" stroke="#004ac6" stroke-width="2.4"/>

    <path d="M -10 -14
             C -19 -9, -19 9, -8 16
             C 1 21, 14 17, 16 5
             C 17.5 -4, 10 -6, 6.5 -12
             C 3.5 -17, -3 -18, -10 -14 Z"
          fill="url(#blueGradNav)"/>

    <path d="M -11 4 C -5 -2, 2 7, 9 2 C 14 -1, 12 -6, 7 -6"
          fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="9" cy="2" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark: single bold line, high legibility at small size -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="30" font-size="24" fill="#111111" font-weight="700" letter-spacing="0.2">Dr. Zaid Gul</text>
    <text x="72" y="48" font-size="11.5" fill="#004ac6" font-weight="600" letter-spacing="1.8">GASTROENTEROLOGIST</text>
  </g>
</svg>
